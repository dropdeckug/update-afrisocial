<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://accounts.google.com https://accounts.google.com/gsi/ https://apis.google.com 'unsafe-inline';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;
             font-src 'self' https://fonts.gstatic.com;
             img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com;
             connect-src 'self' https://afrisocial-backend.onrender.com https://accounts.google.com/gsi/;
             frame-src https://accounts.google.com https://accounts.google.com/gsi/;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>Afrisocial Login – Access Your Account </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <link rel="stylesheet" href="log-in.css" />
  <meta name="theme-color" content="#ffffff" />
  <script src="/security.js"></script>
</head>
<body>
  <div class="page">

    <!-- LEFT — BIG LOGO -->
    <aside class="logo-side">
      <img src="image/afrisocial-logo.png" alt="Afrisocial" class="brand-logo" />
    </aside>

    <!-- RIGHT — AUTH -->
    <main class="auth-side">
      <div class="auth-inner">

        <h1 class="big-title">Happening now.</h1>
        <h2 class="sub-title">Log in to Afrisocial.</h2>

        <!-- Error -->
        <div class="error-wrap" id="errorWrap">
          <div class="error" id="error" role="alert" aria-live="polite">
            <span id="errorText"></span>
          </div>
        </div>

        <form class="login-form" id="loginForm" novalidate>

          <!-- Google -->
          <button type="button" class="btn-social btn-google" id="googleBtn">
            <span class="g-content">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.51h5.84c-.25 1.31-.98 2.42-2.07 3.16v2.63h3.35c1.96-1.81 3.09-4.47 3.09-7.5z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-1.01 7.28-2.73l-3.35-2.63c-1.01.68-2.29 1.08-3.93 1.08-3.02 0-5.58-2.04-6.49-4.79H.96v2.67C2.77 20.39 6.62 23 12 23z"/>
                <path fill="#FBBC05" d="M5.51 14.21c-.23-.68-.36-1.41-.36-2.21s.13-1.53.36-2.21V7.34H.96C.35 8.85 0 10.39 0 12s.35 3.15.96 4.66l4.55-2.45z"/>
                <path fill="#EA4335" d="M12 4.98c1.64 0 3.11.56 4.27 1.66l3.19-3.19C17.46 1.01 14.97 0 12 0 6.62 0 2.77 2.61.96 6.34l4.55 2.45C6.42 7.02 8.98 4.98 12 4.98z"/>
              </svg>
              <span class="g-label">Sign in with Google</span>
            </span>
            <span class="g-spinner" aria-hidden="true"></span>
          </button>

          <div class="divider"><span>or</span></div>


          <!-- Email -->
          <div class="field-group">
            <input
              type="email"
              id="email"
              class="field-input"
              placeholder="Email address"
              autocomplete="email"
              maxlength="254"
              spellcheck="false"
            />
          </div>

          <!-- Password -->
          <div class="field-group">
            <div class="input-c">
              <input
                type="password"
                id="password"
                class="field-input password"
                placeholder="Password"
                autocomplete="current-password"
                maxlength="128"
              />
              <button type="button" class="eye" aria-label="Toggle password visibility" tabindex="0">
                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-.722-3.25"/>
                  <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                  <path d="m20 15-1.726-2.05"/>
                  <path d="m4 15 1.726-2.05"/>
                  <path d="m9 18 .722-3.25"/>
                </svg>
                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Log in</span>
            <span class="btn-spinner" aria-hidden="true"><span class="spinner-ring"></span></span>
          </button>

          <div class="forgot-row">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <p class="legal-text">
            By logging in you agree to our
            <a href="terms.html">Terms &amp; Conditions</a> and
            <a href="guidelines.html">Community Guidelines</a>.
          </p>

        </form>

        <div class="signup-row">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>

      </div>
    </main>

  </div>

  <script src="/linkify.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="log-in.js"></script>
</body>
</html>

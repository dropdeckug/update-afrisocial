<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications – AfriSocial</title>
    <script src="/security.js"></script>
    <script src="/linkify.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000A23">
    <link rel="icon" type="image/png" href="/uploads/favicon.png">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notification.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="google_translate_element" style="display:none;"></div>

  <!-- TOP HEADER -->

  <header class="notif-header">
    <a href="feed.html" class="back-btn" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </a>
    <h1 class="notif-title">Notifications</h1>
    <a href="settings.html" class="settings-btn" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915
          2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33
          4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0
          0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34
          2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </a>
  </header>

  <!-- NOTIFICATION LIST -->

  <main class="notif-main">
    <div id="notificationBox" class="notif-box">
      <!-- Skeleton loaders shown before real data -->
      <div class="skeleton-item"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w80"></div><div class="sk-line w50"></div></div></div>
      <div class="skeleton-item"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w60"></div><div class="sk-line w40"></div></div></div>
      <div class="skeleton-item"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w70"></div><div class="sk-line w30"></div></div></div>
    </div>
  </main>

  <!-- Overlay -->

  <div class="overlay hidden" id="overlay"></div>

  <!-- Post Modal -->

  <div id="postModal" class="post-modal hidden">
    <div class="post-modal-content">
      <div class="modal-header">
        <h3>Post</h3>
        <button id="closePostModal" class="close-post-modal" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="modalPostContainer"></div>
      <div class="comments-label">Comments</div>
      <div id="modalCommentsContainer"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script src="/main.js" type="module"></script>

  <script src="js/theme.js"></script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="/translate.js"></script>
<script>
  if (localStorage.getItem('afri_theme') === 'dark')
    document.documentElement.classList.add('dark');
</script>
  <script src="notification.js"></script>

</body>
</html>

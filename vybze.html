<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vybze</title>
  <script src="/security.js"></script>
  <script src="/linkify.js"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000A23">
  <link rel="icon" type="image/png" href="/uploads/favicon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="shared-nav.css">
  <link rel="stylesheet" href="vybze.css">

</head>
<body>

  <div id="google_translate_element" style="display:none;"></div>

  <header class="top-nav">
    <h1 class="brand">Afrisocial</h1>
    <div class="top-nav-actions">
      <button class="nav-icon-btn" id="openSearch">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="notificationBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="notificationBadge" class="notif-dot"></span>
      </button>
    </div>
  </header>

  <div class="x-layout">
    <div data-shared-nav></div>

    <main class="vybze-main">
      <div class="vybze-title-row">
        <h2>🔥 Vybze</h2>
      </div>
      <div id="vybzeGrid" class="vybze-grid">
        <!-- skeleton cards -->
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
        <div class="skeleton skeleton-rect" style="aspect-ratio: 9/16;"></div>
      </div>
    </main>

    <div data-shared-rightrail></div>
  </div>

  <script src="js/theme.js"></script>
  <script src="shared-nav.js"></script>
  <link rel="stylesheet" href="post-composer.css">
  <script src="post-composer.js"></script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script src="/translate.js"></script>
  <script src="vybze.js"></script>
</body>
</html>

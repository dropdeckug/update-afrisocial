<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afrisocial</title>
  <script src="/security.js"></script>
  <script src="/linkify.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000A23" />
  <link rel="icon" type="image/png" href="/uploads/favicon.png" />
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="shared-nav.css" />
  <link rel="stylesheet" href="feed.css" />
</head>
<body>

<div id="google_translate_element" style="display:none;"></div>

<!-- ══ TOP NAV (mobile only) ══ -->
<header class="top-nav">
  <h1 class="brand">Afrisocial</h1>
  <div class="top-nav-actions">
    <div class="plus-wrap">
      <button class="nav-icon-btn" id="plusBtn" aria-label="Create">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M11 11V4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/>
        </svg>
      </button>
      <div class="plus-dropdown" id="plusDropdown">
        <button class="dropdown-item" id="openPost">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M14.06 9.02l.92.92L5.92 19H5v-.92l9.06-9.06M17.66 3c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83a.996.996 0 000-1.41l-2.34-2.34a.98.98 0 00-.71-.29zm-3.6 3.19L3 17.25V21h3.75L17.81 9.94l-3.75-3.75z"/></svg>
          Create Post
        </button>
        <button class="dropdown-item" id="openBattlePoll">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Battle Poll
        </button>
      </div>
    </div>
    <button class="nav-icon-btn" id="openSearch" aria-label="Search">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M10.25 3.75a6.5 6.5 0 104.087 11.55l4.706 4.707 1.414-1.414-4.707-4.706A6.5 6.5 0 0010.25 3.75zm-4.5 6.5a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0z"/>
      </svg>
    </button>
    <button class="nav-icon-btn" id="notificationBtn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M19.993 9.042C19.62 5.589 16.612 3 13.12 3h-2.24C7.385 3 4.378 5.589 4.007 9.042L3.598 12.85a8.34 8.34 0 01-1.4 3.715 1.687 1.687 0 001.21 2.642l3.469.434c.155 1.875 1.717 3.359 3.623 3.359h3a3.635 3.635 0 003.623-3.359l3.469-.434a1.687 1.687 0 001.21-2.642 8.34 8.34 0 01-1.4-3.715l-.409-3.808zM13.5 20H10.5c-.79 0-1.469-.51-1.715-1.215l5.93-.741c-.246.705-.925 1.215-1.715 1.956z"/>
      </svg>
      <span id="notificationBadge" class="notif-dot"></span>
    </button>
  </div>
</header>

<!-- ══ SEARCH OVERLAY ══ -->
<div id="searchContainer" class="search-container">
  <div class="search-inner">
    <input class="search-input" type="search" placeholder="Search Afrisocial..." id="searchInput" />
    <span id="closeSearch" class="close-search">&times;</span>
  </div>
  <div class="search-result-container">
    <ul id="searchResults"></ul>
  </div>
</div>

<!-- ══ X-STYLE 3-COLUMN LAYOUT ══ -->
<div class="x-layout">

  <!-- LEFT SIDEBAR (shared) -->
  <div data-shared-nav></div>

  <!-- MAIN FEED -->
  <main class="feed-main">
    <div class="stories-row" id="storiesRow">
      <div class="story-card add-story" id="addStoryBtn">
        <div class="story-add-icon">
          <input type="file" id="storyInput" accept="image/*,video/*" hidden />
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <div class="story-plus">+</div>
        </div>
        <span>Add Story</span>
      </div>
    </div>
    <div class="stories-divider"></div>
    <div id="feed" class="feed"></div>
    <div id="feedLoader" class="feed-loader">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </main>

  <!-- RIGHT SIDEBAR (shared) -->
  <div data-shared-rightrail></div>

</div>

<!-- ══ CREATE POST MODAL (X-style) ══ -->
<div class="xp-overlay" id="postModalOverlay"></div>
<div class="xp-modal" id="postModal" role="dialog" aria-modal="true">
  <div class="xp-header">
    <button class="xp-close" id="cancelPost" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M10.59 12L4.54 5.96l1.42-1.42L12 10.59l6.04-6.05 1.42 1.42L13.41 12l6.05 6.04-1.42 1.42L12 13.41l-6.04 6.05-1.42-1.42L10.59 12z"/>
      </svg>
    </button>
    <button class="xp-drafts" type="button">Drafts</button>
  </div>
  <div class="xp-body">
    <div class="xp-row">
      <img src="/uploads/images/africa.png" id="sheetAvatar" class="xp-avatar" alt="" />
      <div class="xp-row-main">
        <button class="xp-audience" type="button">
          <span>Everyone</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <textarea id="postInput" class="xp-input" data-mention placeholder="What's happening?" maxlength="500" rows="4"></textarea>
        <div id="mediaPreview" class="media-preview-container"></div>
      </div>
    </div>
    <button class="xp-reply-scope" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 1.75C6.34 1.75 1.75 6.34 1.75 12S6.34 22.25 12 22.25 22.25 17.66 22.25 12 17.66 1.75 12 1.75zM3.25 12c0-4.83 3.92-8.75 8.75-8.75s8.75 3.92 8.75 8.75-3.92 8.75-8.75 8.75S3.25 16.83 3.25 12z"/></svg>
      <span>Everyone can reply</span>
    </button>
  </div>
  <div class="xp-footer">
    <div class="xp-tools">
      <input type="file" id="postMedia" accept="image/*" multiple hidden />
      <input type="file" id="postVideoMedia" accept="video/*" hidden />
      <button type="button" class="xp-tool-btn" id="mediaUploadBtn" aria-label="Add image">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.75 2H4.25C3.01 2 2 3.01 2 4.25v15.5C2 20.99 3.01 22 4.25 22h15.5c1.24 0 2.25-1.01 2.25-2.25V4.25C22 3.01 20.99 2 19.75 2zM4.25 3.5h15.5c.41 0 .75.34.75.75v9.91l-2.97-2.96c-.29-.3-.77-.3-1.06 0L10.94 17.7l-3.5-3.5c-.29-.29-.77-.29-1.06 0l-2.88 2.88V4.25c0-.41.34-.75.75-.75zm5 6.5C9.25 11.24 8.24 12.25 7 12.25S4.75 11.24 4.75 10 5.76 7.75 7 7.75 9.25 8.76 9.25 10z"/></svg>
      </button>
      <button type="button" class="xp-tool-btn" id="videoUploadBtn" aria-label="Add video">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5.5 5h9c.83 0 1.5.67 1.5 1.5v2.34l4.22-2.43c.48-.28 1.07-.28 1.55 0 .48.28.78.79.78 1.34v8.5c0 .55-.3 1.06-.78 1.34a1.56 1.56 0 01-1.55 0L16 15.16V17.5c0 .83-.67 1.5-1.5 1.5h-9C4.67 19 4 18.33 4 17.5v-11C4 5.67 4.67 5 5.5 5z"/></svg>
      </button>
    </div>
    <div class="xp-submit-wrap">
      <div class="xp-counter" id="postCounter" hidden>
        <svg class="xp-counter-ring" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#2f3336" stroke-width="2"/>
          <circle id="postCounterArc" cx="12" cy="12" r="10" fill="none" stroke="#1d9bf0" stroke-width="2"
                  stroke-dasharray="62.83" stroke-dashoffset="62.83" stroke-linecap="round"
                  transform="rotate(-90 12 12)"/>
        </svg>
        <span class="xp-counter-num" id="postCounterNum"></span>
      </div>
      <button class="post-modal-submit xp-post-btn" id="postBtn" disabled>
        <span id="postBtnText">Post</span>
        <span id="postSpinner" class="spinner" style="display:none;"></span>
      </button>
    </div>
  </div>
</div>

<!-- ══ BATTLE POLL MODAL ══ -->
<div class="post-modal-overlay" id="pollModalOverlay"></div>
<div class="post-modal" id="pollModal">
  <div class="post-modal-handle"></div>
  <div class="post-modal-header">
    <button class="post-modal-cancel" id="cancelPoll">Cancel</button>
    <h3>Battle Poll</h3>
    <button class="post-modal-submit" id="pollSubmitBtn">
      <span id="pollBtnText">Post</span>
      <span id="pollSpinner" class="spinner" style="display:none;"></span>
    </button>
  </div>
  <div class="post-modal-body">
    <input type="text" id="pollTitle" class="poll-title-input" placeholder="Ask a question..." maxlength="200" />
    <div id="pollOptions" class="poll-options-list"></div>
    <button class="toolbar-btn" id="pollAddOption">+ Add Option</button>
    <div class="post-modal-toolbar">
      <input type="file" id="pollCoverMedia" accept="image/*,video/*" hidden />
      <button type="button" class="toolbar-btn" id="pollMediaUploadBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        Photo / Video
      </button>
    </div>
  </div>
</div>

<!-- ══ VOTE MODAL ══ -->
<div class="post-modal-overlay" id="voteModalOverlay"></div>
<div class="post-modal" id="voteModal">
  <div class="post-modal-handle"></div>
  <div class="post-modal-header">
    <button class="post-modal-cancel" id="cancelVote">Cancel</button>
    <h3>Cast Your Vote</h3>
    <div style="width:60px;"></div>
  </div>
  <div class="post-modal-body">
    <p id="voteQuestion" class="vote-question"></p>
    <div id="voteOptions" class="vote-options"></div>
    <div id="voteThanks" class="vote-thanks" style="display:none;">
      <span>🎉 Vote submitted!</span>
      <p id="voteTotalCount"></p>
    </div>
  </div>
</div>

<!-- ══ RESPOND MODAL ══ -->
<div class="post-modal-overlay" id="respondModalOverlay"></div>
<div class="post-modal" id="respondModal">
  <div class="post-modal-handle"></div>
  <div class="post-modal-header">
    <button class="post-modal-cancel" id="cancelRespond">Cancel</button>
    <h3>Respond</h3>
    <button class="post-modal-submit" id="submitRespond">Post</button>
  </div>
  <div class="post-modal-body">
    <p id="respondPollTitle" class="respond-poll-title"></p>
    <textarea id="respondInput" class="post-modal-input" data-mention placeholder="Write your response..." rows="4"></textarea>
    <div class="post-modal-toolbar">
      <input type="file" id="respondMedia" accept="image/*" hidden />
      <button type="button" class="toolbar-btn" id="respondMediaBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        Add Image
      </button>
    </div>
  </div>
</div>

<!-- ══ COMMENT MODAL ══ -->
<div id="commentModal" class="comment-modal">
  <div class="comment-box">
    <div class="comment-header">
      <h3>Comments</h3>
      <span id="closeCommentModal">&times;</span>
    </div>
    <div id="commentList" class="comment-list"></div>
    <div class="comment-input-row">
      <input type="text" id="commentInput" data-mention placeholder="Write a comment..." />
      <button id="sendCommentBtn">Send</button>
    </div>
  </div>
</div>

<!-- ══ GIFT MODAL ══ -->
<div id="feedGiftModal" class="feed-gift-overlay" style="display:none;">
  <div class="feed-gift-box">
    <div class="feed-gift-header">
      <button class="feed-gift-back" id="feedGiftClose">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <h3>Send a Gift</h3>
    </div>
    <div class="feed-gift-balance-row">
      <div class="feed-gift-bal">
        <span>⭐</span><span id="feedGiftStarBal">0</span><span>stars</span>
      </div>
      <button class="feed-gift-recharge-btn" id="feedGiftRechargeBtn" style="display:none;">Recharge</button>
    </div>
    <div class="feed-gift-grid" id="feedGiftGrid"></div>
    <button class="feed-gift-send-btn" id="feedGiftSendBtn">Send Gift</button>
  </div>
</div>

<!-- ══ INSTALL POPUP ══ -->
<div id="installPopup" class="install-popup">
  <p>Install Afrisocial for a better experience 📢</p>
  <button onclick="installApp()">Install</button>
  <button onclick="closeInstallPopup()">Not now</button>
</div>

<!-- ══ STORY CREATOR ══ -->
<div id="storyCreator" class="story-creator">
  <div id="storyCreatorStep1" class="sc-step">
    <div class="sc-topbar">
      <button class="sc-btn-icon" id="scClose">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <span class="sc-topbar-title">Your Story</span>
      <div style="width:40px;"></div>
    </div>
    <div class="sc-viewport" id="scViewport">
      <div class="sc-media-wrap" id="scMediaWrap">
        <img id="scPreviewImg" /><video id="scPreviewVid" playsinline></video>
      </div>
    </div>
    <div class="sc-zoom-bar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <input type="range" id="scZoom" min="1" max="3" step="0.01" value="1" class="sc-zoom-slider"/>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </div>
    <button class="sc-next-btn" id="scNextBtn">
      Next
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000A23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
  <div id="storyCreatorStep2" class="sc-step hidden">
    <div class="sc-topbar">
      <button class="sc-btn-icon" id="scBack">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="sc-topbar-title">Add Caption</span>
      <div style="width:40px;"></div>
    </div>
    <div class="sc-thumb-wrap">
      <img id="scThumbImg" class="sc-thumb"/>
      <video id="scThumbVid" class="sc-thumb" muted playsinline loop></video>
      <div class="sc-caption-overlay" id="scCaptionOverlay"></div>
    </div>
    <div class="sc-caption-bar">
      <div class="sc-caption-input-wrap">
        <textarea id="scCaption" class="sc-caption-input" placeholder="Add a caption..." maxlength="200" rows="2"></textarea>
        <span class="sc-char-count" id="scCharCount">0/200</span>
      </div>
    </div>
    <button class="sc-post-btn" id="scPostBtn">
      <span id="scPostBtnText">Post Story</span>
      <span id="scPostSpinner" class="spinner hidden"></span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<!-- ══ STORY VIEWER ══ -->
<div id="storyViewer" class="story-viewer">
  <div class="story-progress" id="storyProgress"></div>
  <img id="storyImage" /><video id="storyVideo" playsinline></video>
  <div class="story-top">
    <div id="storyUsername" class="story-user-info"></div>
    <button id="closeStory" style="background:none;border:none;color:#fff;font-size:28px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0;">&times;</button>
  </div>
  <div id="storyCaption" class="story-caption-view"></div>
  <div id="viewersBtn" class="viewers-btn">👁 see viewers</div>
  <div class="story-reactions">
    <button data-emoji="🔥">🔥</button>
    <button data-emoji="❤️">❤️</button>
    <button data-emoji="👏">👏</button>
    <button data-emoji="😂">😂</button>
    <button data-emoji="😭">😭</button>
    <button data-emoji="🙏">🙏</button>
    <button data-emoji="🎉">🎉</button>
  </div>
</div>

<!-- ══ SHARE PANEL ══ -->
<div id="shareModal" class="share-modal">
  <div class="share-content">
    <h3>Share</h3>
    <div class="share-grid">
      <button class="share-option" id="shareWhatsapp"><img src="/icons/images (3).jpeg"><span>WhatsApp</span></button>
      <button class="share-option" id="shareFacebook"><img src="/icons/Logo_de_Facebook.png"><span>Facebook</span></button>
      <button class="share-option" id="shareCopy"><img src="/icons/images (4).jpeg"><span>Copy Link</span></button>
      <button class="share-option" id="shareMessage"><img src="/icons/favicon.png"><span>Message</span></button>
    </div>
    <button id="closeShareModal" class="share-close">Cancel</button>
  </div>
</div>

<!-- ══ STORY VIEWERS MODAL ══ -->
<div id="storyViewersModal" class="story-viewers-modal">
  <div class="story-viewers-content" id="storyViewersContent">
    <div class="drag-handle"></div>
    <div class="story-viewers-header">
      <span>Viewers</span><span id="closeViewers">&times;</span>
    </div>
    <div id="storyViewersList" class="story-viewers-list"></div>
  </div>
</div>

<div id="notificationBox"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="/main.js" type="module"></script>
<script src="js/theme.js"></script>
<script src="shared-nav.js"></script>
<link rel="stylesheet" href="post-composer.css">
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="/translate.js"></script>
<script src="feed.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrisocial — Secure Moderation Gateway</title>
    <style>
        :root {
            --bg-dark: #0f141c;
            --bg-card: #18202c;
            --bg-input: #111823;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #2563eb;
            --accent-orange: #f59e0b;
            --accent-red: #dc2626;
            --border: #243143;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🔒 SECURE LOCKSCREEN STYLES */
        #lockscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .login-card p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: var(--accent-red);
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        /* 🖥️ DASHBOARD STYLES (HIDDEN BY DEFAULT) */
        #dashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        header .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-dark);
            padding: 0.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
        }

        .tab-btn.active {
            background-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .btn-logout {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-logout:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .panel { display: none; }
        .panel.active { display: block; }
        .panel-header { margin-bottom: 1.5rem; }
        .panel-header h2 { font-size: 1.5rem; }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
        }

        .user-meta h3 { font-size: 0.95rem; font-weight: 600; }
        .user-meta p { font-size: 0.8rem; color: var(--text-secondary); }

        .status-pill {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }
        .status-active { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .status-suspended { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); }
        .status-terminated { background: rgba(220, 38, 38, 0.15); color: var(--accent-red); }

        .card-content {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            word-break: break-word;
        }

        .card-media {
            margin-top: 0.75rem;
            border-radius: 8px;
            overflow: hidden;
            max-height: 220px;
            background-color: var(--bg-input);
        }

        .card-media img, .card-media video {
            width: 100%; height: 100%; object-fit: cover;
        }

        .reason-box {
            background-color: rgba(245, 158, 11, 0.08);
            border-left: 3px solid var(--accent-orange);
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            color: var(--accent-orange);
            border-radius: 0 6px 6px 0;
            margin-bottom: 1rem;
        }

        .card-actions {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1; padding: 0.55rem; border: none; border-radius: 6px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center;
        }

        .btn-delete { background-color: rgba(220, 38, 38, 0.15); color: #f87171; }
        .btn-delete:hover { background-color: var(--accent-red); color: white; }
        .btn-restore { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .btn-restore:hover { background-color: var(--accent-green); color: white; }
        .btn-suspend { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .btn-suspend:hover { background-color: var(--accent-orange); color: var(--bg-dark); }
        .btn-terminate { background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-terminate:hover { background-color: var(--accent-red); color: white; border-color: var(--accent-red); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 5rem 2rem;
            color: var(--text-secondary); border: 2px dashed var(--border); border-radius: 12px;
        }
    </style>
</head>
<body>

    <div id="lockscreen">
        <div class="login-card">
            <h2>Admin Gateway</h2>
            <p>Two-credential verification required to view system infrastructure.</p>
            
            <form id="login-form" onsubmit="handleAdminLogin(event)">
                <div class="input-group">
                    <label>Admin Identity / Email</label>
                    <input type="text" id="admin-identity" required placeholder="admin@afrisocial.com">
                </div>
                <div class="input-group">
                    <label>Secret Security Token</label>
                    <input type="password" id="admin-token" required placeholder="••••••••••••">
                </div>
                <button type="submit" class="btn-login">Verify Credentials</button>
                <div id="error-box" class="error-msg">Mismatched administrative permissions.</div>
            </form>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div class="brand">
                <img src="/uploads/images/africa.png" alt="Logo">
                <h1>Afrisocial Moderation Suite</h1>
            </div>
            <div class="header-actions">
                <div class="tabs">
                    <button id="tab-live" class="tab-btn active" onclick="changePanel('live')">Live Monitor Feed</button>
                    <button id="tab-review" class="tab-btn" onclick="changePanel('review')">Escalated Review</button>
                </div>
                <button class="btn-logout" onclick="handleLogout()">Lock Terminal</button>
            </div>
        </header>

        <main>
            <div id="panel-live" class="panel active">
                <div class="panel-header"><h2>Active Platform Publications</h2></div>
                <div id="grid-live" class="feed-grid"></div>
            </div>

            <div id="panel-review" class="panel">
                <div class="panel-header"><h2>Escalated For Final Action</h2></div>
                <div id="grid-review" class="feed-grid"></div>
            </div>
        </main>
    </div>

    <script>
        const BASE_URL = 'https://afrisocial-backend.onrender.com/api/moderation';
        
        // Securely hold token authorization context in volatile memory or session storage
        let adminAuthToken = sessionStorage.getItem('adm_auth_key') || '';

        // On document initialization, check if token exists to bypass lockscreen
        document.addEventListener('DOMContentLoaded', () => {
            if (adminAuthToken) {
                unlockDashboard();
            }
        });

// Two-credential Security Handler (Database-Independent Backend Validation)
async function handleAdminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('admin-identity').value.trim();
    const password = document.getElementById('admin-token').value.trim();
    const errorBox = document.getElementById('error-box');
    
    errorBox.style.display = 'none';

    try {
        // Send credentials directly to your secure verification route on the backend
          const response = await fetch(`${BASE_URL}/admin/gateway-verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();

        if (response.ok && data.success && data.masterKey) {
            // Save the unique key string returned by your secure backend environment
            adminAuthToken = data.masterKey;
            sessionStorage.setItem('adm_auth_key', adminAuthToken);
            unlockDashboard();
        } else {
            throw new Error(data.message || "Unauthorized gateway login.");
        }
    } catch (err) {
        errorBox.textContent = "Access Denied: Invalid master credentials.";
        errorBox.style.display = 'block';
    }
}

        function unlockDashboard() {
            document.getElementById('lockscreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            fetchLiveFeed();
        }

        function handleLogout() {
            sessionStorage.removeItem('adm_auth_key');
            adminAuthToken = '';
            window.location.reload();
        }

        // Helper to supply standard secure authorization header maps
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${adminAuthToken}` // Adapts securely to your `auth` middleware pattern
            };
        }

        // 2. View Panel Toggle Logic
        function changePanel(target) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if (target === 'live') {
                document.getElementById('tab-live').classList.add('active');
                document.getElementById('panel-live').classList.add('active');
                fetchLiveFeed();
            } else {
                document.getElementById('tab-review').classList.add('active');
                document.getElementById('panel-review').classList.add('active');
                fetchReviewQueue();
            }
        }

        // 3. Queue Fetching Engine
        async function fetchLiveFeed() {
            const grid = document.getElementById('grid-live');
            grid.innerHTML = '<div class="empty-state">Pulling active feed monitoring parameters...</div>';
            
            try {
                const response = await fetch(`${BASE_URL}/admin/queue/main`, { headers: getAuthHeaders() });
                const data = await response.json();

                if (!data.success || !data.posts || data.posts.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No active community posts found matching standard index criteria.</div>';
                    return;
                }

                grid.innerHTML = data.posts.map(post => {
                    const author = post.user || { fullName: "Afrisocial Member", username: "unknown", profilePicture: "/uploads/images/africa.png", accountStatus: "active" };
                    return `
                        <div class="card" id="post-${post._id}">
                            <div>
                                <div class="card-top">
                                    <img class="avatar" src="${author.profilePicture}" onerror="this.src='/uploads/images/africa.png'" alt="">
                                    <div class="user-meta">
                                        <h3>${escapeHTML(author.fullName)} <span class="status-pill status-${author.accountStatus || 'active'}">${author.accountStatus || 'active'}</span></h3>
                                        <p>@${escapeHTML(author.username)}</p>
                                    </div>
                                </div>
                                <div class="card-content">
                                    <p>${escapeHTML(post.text || '')}</p>
                                    ${renderMedia(post)}
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-delete" onclick="triggerSoftDelete('${post._id}')">Soft Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Failed to pull metrics. Session validation token expired.</div>';
            }
        }

        async function fetchReviewQueue() {
            const grid = document.getElementById('grid-review');
            grid.innerHTML = '<div class="empty-state">Pulling review pipeline updates...</div>';
            
            try {
                const response = await fetch(`${BASE_URL}/admin/queue/review`, { headers: getAuthHeaders() });
                const data = await response.json();

                if (!data.success || !data.posts || data.posts.length === 0) {
                    grid.innerHTML = '<div class="empty-state">Clean pipeline! No content currently requires evaluation loops.</div>';
                    return;
                }

                grid.innerHTML = data.posts.map(post => {
                    const author = post.user || { fullName: "Afrisocial Member", username: "unknown", profilePicture: "/uploads/images/africa.png", accountStatus: "active" };
                    return `
                        <div class="card" id="post-${post._id}">
                            <div>
                                <div class="card-top">
                                    <img class="avatar" src="${author.profilePicture}" onerror="this.src='/uploads/images/africa.png'" alt="">
                                    <div class="user-meta">
                                        <h3>${escapeHTML(author.fullName)} <span class="status-pill status-${author.accountStatus || 'active'}">${author.accountStatus || 'active'}</span></h3>
                                        <p>@${escapeHTML(author.username)}</p>
                                    </div>
                                </div>
                                <div class="reason-box"><strong>Flag Log:</strong> ${escapeHTML(post.moderationReason || 'Flagged for overview')}</div>
                                <div class="card-content">
                                    <p>${escapeHTML(post.text || '')}</p>
                                    ${renderMedia(post)}
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-restore" onclick="triggerFinalAction('${post._id}', 'restore')">Restore</button>
                                <button class="btn btn-suspend" onclick="triggerFinalAction('${post._id}', 'suspend')">Suspend</button>
                                <button class="btn btn-terminate" onclick="triggerFinalAction('${post._id}', 'terminate')">Terminate</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Error reading verification stream indexes.</div>';
            }
        }

        // 4. Action Command Execution Triggers
        async function triggerSoftDelete(postId) {
            const reason = prompt("State baseline reason for isolating this publication:");
            if (reason === null) return; 

            try {
                const res = await fetch(`${BASE_URL}/admin/post/${postId}/soft-delete`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ reason: reason })
                });
                const confirmation = await res.json();
                if (res.ok && confirmation.success) {
                    document.getElementById(`post-${postId}`).remove();
                } else {
                    alert("Operation restricted or session invalid.");
                }
            } catch (err) {
                alert("Network execution exception error.");
            }
        }

        async function triggerFinalAction(postId, decisionType) {
            const validationPrompt = confirm(`Execute destination directive sequence: [${decisionType.toUpperCase()}]?`);
            if (!validationPrompt) return;

            let logReason = "";
            if (decisionType === 'suspend' || decisionType === 'terminate') {
                logReason = prompt(`Enter tracking log payload reason for profile state conversion [${decisionType}]:`);
                if (logReason === null) return;
            }

            try {
                const res = await fetch(`${BASE_URL}/admin/post/${postId}/final-decision`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ action: decisionType, reason: logReason })
                });
                const confirmation = await res.json();
                if (res.ok && confirmation.success) {
                    document.getElementById(`post-${postId}`).remove();
                } else {
                    alert("Action verification mismatch or context expired.");
                }
            } catch (err) {
                alert("Error sending operations criteria context message.");
            }
        }

        function renderMedia(post) {
            if (post.images && post.images.length > 0) {
                return `<div class="card-media"><img src="${post.images[0]}" alt=""></div>`;
            } else if (post.video) {
                return `<div class="card-media"><video src="${post.video}" controls></video></div>`;
            }
            return '';
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
  </html>

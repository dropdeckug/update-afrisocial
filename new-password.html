<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password</title>
    <link rel="icon" type="image/png" href="/uploads/favicon.png">
     <link rel="stylesheet" href="new-password.css">
</head>
<body>
    <div class="container">
        <h2>Reset your  password</h2>
        <p>your new password must be different from your previously used passwords.</p>
        <form class="new-password-form">
            <input type="password" placeholder="New password" required id="password">
            <input type="password" placeholder="Confirm New Password" required>
            <button type="button" onclick="resetPassword(event)">Update Password</button>
        </form>
    </div>
    <script src="new-password.js"></script>  
    
    <!-- Password Updated Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal-box">
    <h3>Password Updated!</h3>
    <p>You can now log in to your account with your new password.</p>
    <button type="button" onclick="goToLogin()">Continue to Login</button>
  </div>
</div>
    
</body>


</html>
